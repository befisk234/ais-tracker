<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SD Fish Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');

    :root {
      --navy:    #0b1a2e;
      --navy2:   #112240;
      --navy3:   #1a3358;
      --steel:   #1e4d7a;
      --ocean:   #0d3b5e;
      --brass:   #c9a227;
      --brass2:  #e8b830;
      --seafoam: #2ee8b5;
      --white:   #f0f4f8;
      --mist:    #a8bdd0;
      --dim:     #5a7a96;
      --danger:  #e74c3c;
      --border:  #1e3a5a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--navy);
      color: var(--white);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      padding: 0 16px;
      background: var(--navy2);
      border-bottom: 2px solid var(--brass);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      height: 52px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-brand svg { flex-shrink: 0; }

    header h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      white-space: nowrap;
      color: var(--white);
      text-transform: uppercase;
    }
    header h1 span { color: var(--brass2); }

    #manage-btn {
      background: var(--navy3);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--mist);
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #manage-btn:hover { border-color: var(--brass); color: var(--brass2); }
    #manage-btn.active { background: #2a1f00; border-color: var(--brass); color: var(--brass2); }

    #status {
      margin-left: auto;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--mist);
      flex-shrink: 0;
    }
    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
    }
    #status-dot.live { background: var(--seafoam); box-shadow: 0 0 6px var(--seafoam); }
    #status-dot.error { background: var(--danger); }

    #logout-form { margin-left: 8px; flex-shrink: 0; }
    #logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--dim);
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    #logout-btn:hover { color: var(--danger); border-color: var(--danger); }

    /* ── Date bar ── */
    #date-bar {
      background: var(--ocean);
      border-bottom: 1px solid var(--border);
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      flex-wrap: wrap;
      min-height: 40px;
    }

    #no-vessel-msg {
      font-size: 12px;
      color: var(--dim);
      font-style: italic;
    }

    #date-inputs {
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .date-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .date-group label {
      font-size: 11px;
      color: var(--dim);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .date-group input[type="datetime-local"] {
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--white);
      padding: 4px 8px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
      color-scheme: dark;
    }
    .date-group input[type="datetime-local"]:focus { border-color: var(--brass); }

    #load-track-btn {
      background: var(--steel);
      color: var(--white);
      border: 1px solid var(--brass);
      border-radius: 4px;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }
    #load-track-btn:hover { background: var(--brass); color: var(--navy); }

    #live-mode-btn {
      background: transparent;
      color: var(--seafoam);
      border: 1px solid var(--seafoam);
      border-radius: 4px;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: none;
    }
    #live-mode-btn:hover { background: var(--seafoam); color: var(--navy); }

    /* ── Map ── */
    #map { flex: 1; min-height: 0; }

    /* ── Manager panel ── */
    #manager-panel {
      position: absolute;
      top: 104px;
      left: 16px;
      z-index: 1000;
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      width: 290px;
      backdrop-filter: blur(8px);
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #manager-panel.open { display: block; }

    #drawer-handle {
      display: none;
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 12px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .panel-header h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--brass);
      flex: 1;
    }
    .panel-close {
      background: none; border: none;
      color: var(--dim); font-size: 20px;
      line-height: 1; cursor: pointer; padding: 0;
    }
    .panel-close:hover { color: var(--danger); }

    .manager-section { margin-bottom: 18px; }
    .manager-section h3 {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--dim);
      margin-bottom: 10px;
    }

    .form-group { margin-bottom: 10px; }
    .form-group label { font-size: 12px; color: var(--mist); display: block; margin-bottom: 4px; }
    .form-group input[type="text"] {
      width: 100%;
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--white);
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
    }
    .form-group input[type="text"]:focus { border-color: var(--brass); }

    .form-color-row { display: flex; align-items: center; gap: 10px; }
    .form-group input[type="color"] {
      width: 36px; height: 28px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--navy);
      cursor: pointer; padding: 2px; flex-shrink: 0;
    }
    #new-boat-color-label { font-size: 12px; color: var(--dim); font-family: monospace; }

    .btn-primary {
      width: 100%;
      background: var(--steel);
      color: var(--white);
      border: 1px solid var(--brass);
      border-radius: 5px;
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }
    .btn-primary:hover { background: var(--brass); color: var(--navy); }
    .btn-primary:disabled { background: #0a2040; border-color: var(--border); color: var(--dim); cursor: default; }

    .form-error { font-size: 12px; color: var(--danger); margin-top: 6px; min-height: 16px; }

    .manager-boat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 4px;
      border-bottom: 1px solid var(--border);
    }
    .manager-boat-item:last-child { border-bottom: none; }

    .color-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    .manager-boat-name { flex: 1; min-width: 0; }
    .manager-boat-name .name {
      font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--white);
    }
    .manager-boat-name .mmsi { font-size: 11px; color: var(--dim); }

    .toggle-switch { position: relative; width: 32px; height: 17px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #1a3358; border-radius: 17px; transition: background 0.2s;
    }
    .toggle-slider::before {
      content: "";
      position: absolute;
      width: 11px; height: 11px;
      left: 3px; bottom: 3px;
      background: var(--dim);
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle-switch input:checked + .toggle-slider { background: var(--steel); }
    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(15px); background: var(--brass2);
    }

    .btn-sm {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--dim);
      padding: 2px 7px;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .btn-sm:hover { color: var(--white); border-color: var(--steel); }
    .btn-sm.danger:hover { color: var(--danger); border-color: var(--danger); }
    .btn-sm:disabled { opacity: 0.4; cursor: default; }

    /* ── Right sidebar ── */
    #sidebar {
      position: absolute;
      top: 104px;
      right: 16px;
      z-index: 1000;
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 268px;
      backdrop-filter: blur(8px);
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }

    .sidebar-vessels {
      flex: 1;
      padding: 12px 14px;
      min-height: 0;
      overflow-y: auto;
    }

    /* ── Marine widgets ── */
    .sidebar-widgets {
      border-top: 1px solid var(--border);
      padding: 10px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .widget-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .widget {
      background: var(--ocean);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 9px;
    }
    .widget-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--dim);
      margin-bottom: 3px;
    }
    .widget-value {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--brass2);
      line-height: 1.1;
    }
    .widget-unit {
      font-size: 10px;
      color: var(--mist);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
    }
    .widget-sub {
      font-size: 10px;
      color: var(--mist);
      margin-top: 1px;
    }
    .widget.wide {
      grid-column: 1 / -1;
    }
    .widget-value.loading { color: var(--dim); font-size: 13px; font-family: 'Inter', sans-serif; }

    /* Fishing grounds toggle */
    #fishing-toggle {
      background: var(--navy3);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--mist);
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #fishing-toggle:hover { border-color: var(--brass); color: var(--brass2); }
    #fishing-toggle.active { border-color: var(--brass); color: var(--brass2); background: #1a1400; }
    #fishing-toggle .fish-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--dim); flex-shrink: 0;
    }
    #fishing-toggle.active .fish-dot { background: var(--brass2); }

    #sidebar h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--brass);
      margin-bottom: 10px;
    }

    .boat-card {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 9px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 5px;
      border: 1px solid transparent;
    }
    .boat-card:hover { background: var(--navy3); border-color: var(--border); }
    .boat-card.solo-active {
      background: var(--ocean);
      border: 1px solid var(--brass);
    }

    /* Activity status dot (green = seen last hour, red = not) */
    .activity-dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }
    .activity-dot.act-green { background: #22c55e; box-shadow: 0 0 4px #22c55e88; }
    .activity-dot.act-red   { background: var(--danger); }

    .boat-dot {
      width: 12px; height: 12px; border-radius: 50%;
      flex-shrink: 0;
      margin-top: 3px;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .boat-info { flex: 1; min-width: 0; }
    .boat-name {
      font-size: 14px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--white);
    }
    .boat-mmsi { font-size: 10px; color: var(--dim); margin-top: 1px; letter-spacing: 0.3px; }
    .boat-last-seen { font-size: 10px; color: var(--dim); margin-top: 3px; }

    /* Color dropdown in sidebar */
    .color-select {
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--dim);
      font-size: 10px;
      padding: 2px 4px;
      cursor: pointer;
      outline: none;
      margin-top: 4px;
      display: block;
      width: 100%;
    }
    .color-select:focus { border-color: var(--brass); }

    .boat-speed-dist {
      text-align: right;
      flex-shrink: 0;
    }
    .boat-speed { font-size: 13px; color: var(--mist); font-family: 'Barlow Condensed', sans-serif; font-weight: 600; }
    .boat-dist { font-size: 10px; color: var(--dim); margin-top: 2px; white-space: nowrap; }

    /* Eye visibility toggle button */
    .eye-btn {
      background: none;
      border: none;
      color: var(--dim);
      cursor: pointer;
      padding: 3px;
      flex-shrink: 0;
      margin-top: 1px;
      border-radius: 3px;
      line-height: 1;
    }
    .eye-btn:hover { color: var(--white); background: var(--navy3); }
    .eye-btn.eye-hidden { color: var(--danger); }

    #no-boats { font-size: 13px; color: var(--dim); text-align: center; padding: 8px 0; }

    /* ── Fishing grounds markers ── */
    .fishing-ground-label {
      background: rgba(11, 26, 46, 0.9);
      border: 1px solid var(--brass);
      border-radius: 4px;
      color: var(--brass2);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 3px 7px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    /* ── Leaflet overrides ── */
    .leaflet-tooltip.boat-name-label {
      background: rgba(17, 34, 64, 0.95);
      border: 1px solid var(--brass);
      border-radius: 4px;
      color: var(--white);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      box-shadow: none;
      white-space: nowrap;
    }
    .leaflet-tooltip.boat-name-label::before { display: none; }

    .leaflet-tooltip.coord-tip {
      background: rgba(11, 26, 46, 0.96);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--mist);
      font-size: 11px;
      font-family: monospace;
      padding: 5px 9px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      pointer-events: none;
      line-height: 1.6;
      white-space: nowrap;
    }
    .leaflet-tooltip.coord-tip::before { display: none; }

    .leaflet-popup-content-wrapper {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--white);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
    }
    .leaflet-popup-tip { background: var(--navy2); }
    .leaflet-popup-close-button { color: var(--dim) !important; font-size: 18px !important; top: 6px !important; right: 8px !important; }
    .leaflet-popup-close-button:hover { color: var(--danger) !important; }
    .leaflet-popup-content { margin: 12px 14px; line-height: 1.5; }

    .save-form { min-width: 210px; }
    .save-form .sf-coords { font-size: 11px; color: var(--dim); margin-bottom: 10px; font-family: monospace; }
    .save-form .sf-field { margin-bottom: 8px; }
    .save-form .sf-label { font-size: 12px; color: var(--mist); display: block; margin-bottom: 3px; }
    .save-form input[type="text"],
    .save-form textarea {
      width: 100%;
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--white);
      padding: 5px 8px;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }
    .save-form input[type="text"]:focus,
    .save-form textarea:focus { border-color: var(--brass); }
    .save-form textarea { resize: vertical; min-height: 60px; }
    .save-form .sf-btn {
      width: 100%;
      background: var(--steel);
      color: var(--white);
      border: 1px solid var(--brass);
      border-radius: 5px;
      padding: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 2px;
    }
    .save-form .sf-btn:hover { background: var(--brass); color: var(--navy); }
    .save-form .sf-btn:disabled { opacity: 0.5; cursor: default; }
    .save-form .sf-err { font-size: 11px; color: var(--danger); margin-top: 4px; min-height: 14px; }

    .point-popup .pt-name { font-weight: 600; color: var(--brass2); }
    .point-popup .pt-coords { font-size: 10px; color: var(--dim); font-family: monospace; margin-top: 2px; }
    .point-popup .pt-notes { margin-top: 6px; font-size: 12px; color: var(--mist); white-space: pre-wrap; word-break: break-word; }
    .point-popup .pt-date { font-size: 10px; color: var(--dim); margin-top: 6px; }

    /* ── Map controls ── */
    .map-nav-control {
      background: rgba(17, 34, 64, 0.92) !important;
      border: 1px solid var(--border) !important;
      border-radius: 6px !important;
      overflow: hidden;
    }
    .map-nav-btn {
      display: block;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--mist);
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      width: 100%;
      text-align: left;
      letter-spacing: 0.3px;
      font-family: 'Inter', sans-serif;
    }
    .map-nav-btn:last-child { border-bottom: none; }
    .map-nav-btn:hover { background: var(--navy3); color: var(--brass2); }

    /* Compass rose */
    .compass-rose-control {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    /* Nautical scale */
    .nautical-scale-control {
      background: rgba(11, 26, 46, 0.85) !important;
      border: 1px solid var(--border) !important;
      border-radius: 4px !important;
      padding: 4px 8px !important;
      color: var(--mist) !important;
      font-size: 10px !important;
      font-family: 'Inter', sans-serif !important;
      pointer-events: none;
    }
    .ns-bar {
      height: 3px;
      background: var(--mist);
      border-left: 2px solid var(--mist);
      border-right: 2px solid var(--mist);
      margin-bottom: 2px;
    }
    .ns-label {
      color: var(--mist);
      font-size: 10px;
      text-align: center;
    }

    /* Boat popup */
    .boat-popup { min-width: 170px; }
    .boat-popup .bp-name { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
    .boat-popup .bp-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
    .boat-popup .bp-label { color: var(--dim); }
    .boat-popup .bp-val { color: var(--white); font-weight: 500; }

    /* ── Mobile ── */
    @media (max-width: 767px) {
      header { padding: 0 12px; }
      header h1 { font-size: 18px; }
      #status-text { display: none; }

      #date-bar { padding: 5px 10px; gap: 6px; }
      #date-inputs { gap: 5px; }
      .date-group { flex: 1; min-width: 0; }
      .date-group label { display: none; }
      .date-group input[type="datetime-local"] { font-size: 11px; padding: 4px 5px; width: 100%; }
      #load-track-btn, #live-mode-btn { padding: 4px 10px; font-size: 11px; }

      #manager-panel {
        position: fixed !important;
        top: auto !important; bottom: 0 !important;
        left: 0 !important; right: 0 !important;
        width: 100% !important;
        max-height: 72vh;
        border-radius: 14px 14px 0 0;
        border-bottom: none;
        display: block !important;
        transform: translateY(110%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow-y: auto;
        z-index: 1100;
        padding: 8px 16px 24px;
      }
      #manager-panel.open { transform: translateY(0); }
      #drawer-handle { display: block; }

      #sidebar {
        position: fixed !important;
        top: auto !important; bottom: 0 !important;
        left: 0 !important; right: 0 !important;
        width: 100% !important;
        max-height: none;
        border-radius: 0;
        border: none;
        border-top: 2px solid var(--brass);
        z-index: 900;
        flex-direction: column;
      }
      .sidebar-widgets { display: none; }
      .sidebar-vessels {
        display: flex;
        flex-direction: row;
        align-items: center;
        padding: 0 10px;
        height: 68px;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
      }
      #sidebar h2 { display: none; }
      #boat-list {
        display: flex;
        flex-direction: row;
        gap: 6px;
        align-items: center;
        flex: 1;
        padding: 6px 0;
      }
      #no-boats { white-space: nowrap; font-size: 12px; padding: 0; }
      .boat-card {
        flex-shrink: 0;
        min-width: 110px;
        margin-bottom: 0;
        padding: 6px 8px;
        align-items: center;
        height: 52px;
        background: var(--navy3);
      }
      .boat-name { font-size: 12px; }
      .boat-mmsi { font-size: 10px; }
      .boat-dist, .boat-last-seen, .color-select, .eye-btn { display: none; }

      #map { margin-bottom: 68px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-brand">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <path d="M13 3 L5 18 L13 15 L21 18 Z" fill="#c9a227" stroke="#e8b830" stroke-width="0.5"/>
        <rect x="12.5" y="3" width="1" height="15" fill="#c9a227"/>
        <path d="M5 18 Q13 22 21 18 L21 21 Q13 25 5 21 Z" fill="#0d3b5e" stroke="#1e4d7a" stroke-width="0.5"/>
      </svg>
      <h1>SD <span>Fish</span> Tracker</h1>
    </div>
    <button id="manage-btn" onclick="toggleManager()">Manage</button>
    <div id="status">
      <div id="status-dot"></div>
      <span id="status-text">Loading...</span>
    </div>
    <form id="logout-form" method="post" action="/logout">
      <button type="submit" id="logout-btn">Sign out</button>
    </form>
  </header>

  <div id="date-bar">
    <span id="no-vessel-msg">Select a vessel first</span>
    <div id="date-inputs">
      <div class="date-group">
        <label for="date-start">From</label>
        <input type="datetime-local" id="date-start" />
      </div>
      <div class="date-group">
        <label for="date-end">To</label>
        <input type="datetime-local" id="date-end" />
      </div>
      <button id="load-track-btn" onclick="applyFilter()">Load Track</button>
      <button id="live-mode-btn" onclick="enterLiveMode()">&#9679; Live</button>
    </div>
  </div>

  <div id="map"></div>

  <!-- Boat Manager panel -->
  <div id="manager-panel">
    <div id="drawer-handle"></div>
    <div class="panel-header">
      <h2>Vessel Manager</h2>
      <button class="panel-close" onclick="toggleManager()" title="Close">&times;</button>
    </div>

    <div class="manager-section">
      <h3>Add Vessel</h3>
      <form id="add-boat-form">
        <div class="form-group">
          <label for="new-boat-name">Boat Name</label>
          <input type="text" id="new-boat-name" placeholder="My Vessel" required />
        </div>
        <div class="form-group">
          <label for="new-boat-mmsi">MMSI</label>
          <input type="text" id="new-boat-mmsi" placeholder="338234916" required />
        </div>
        <div class="form-group">
          <label>Track Color</label>
          <div class="form-color-row">
            <input type="color" id="new-boat-color" value="#c9a227" />
            <span id="new-boat-color-label">#c9a227</span>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="add-boat-btn">Add Vessel</button>
        <div class="form-error" id="add-error"></div>
      </form>
    </div>

    <div class="manager-section">
      <h3>Tracked Vessels</h3>
      <div id="manager-boat-list"></div>
    </div>
  </div>

  <!-- Right sidebar: vessels + widgets -->
  <div id="sidebar">
    <div class="sidebar-vessels">
      <h2>Vessels</h2>
      <div id="boat-list"><div id="no-boats">No vessels tracked</div></div>
    </div>
    <div class="sidebar-widgets">
      <div class="widget-row">
        <div class="widget" id="w-tide">
          <div class="widget-label">Tide (SD Bay)</div>
          <div class="widget-value loading" id="tide-val">...</div>
          <div class="widget-sub" id="tide-sub"></div>
        </div>
        <div class="widget" id="w-sst">
          <div class="widget-label">Sea Temp</div>
          <div class="widget-value loading" id="sst-val">...</div>
          <div class="widget-sub" id="sst-sub"></div>
        </div>
      </div>
      <div class="widget-row">
        <div class="widget" id="w-wind">
          <div class="widget-label">Wind (46225)</div>
          <div class="widget-value loading" id="wind-val">...</div>
          <div class="widget-sub" id="wind-sub"></div>
        </div>
        <div class="widget" id="w-sun">
          <div class="widget-label">Sun (SD)</div>
          <div class="widget-value loading" id="sun-val">...</div>
          <div class="widget-sub" id="sun-sub"></div>
        </div>
      </div>
      <button id="fishing-toggle" onclick="toggleFishingGrounds()">
        <span class="fish-dot"></span>
        Fishing Grounds
      </button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const SAN_DIEGO = [32.7, -117.2];
    const POINT_LOMA = [32.6644, -117.2417];

    const COLOR_OPTIONS = [
      { name: 'Red',     value: '#dc2626' },
      { name: 'Blue',    value: '#2563eb' },
      { name: 'Green',   value: '#16a34a' },
      { name: 'Purple',  value: '#9333ea' },
      { name: 'Orange',  value: '#ea580c' },
      { name: 'Pink',    value: '#ec4899' },
      { name: 'Cyan',    value: '#06b6d4' },
      { name: 'Yellow',  value: '#eab308' },
      { name: 'Black',   value: '#000000' },
      { name: 'White',   value: '#ffffff' },
      { name: 'Magenta', value: '#d946ef' },
      { name: 'Lime',    value: '#84cc16' },
      { name: 'Teal',    value: '#14b8a6' },
      { name: 'Brown',   value: '#92400e' },
      { name: 'Navy',    value: '#1e3a8a' },
      { name: 'Maroon',  value: '#7f1d1d' },
    ];

    const EYE_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const EYE_OFF_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

    const map = L.map("map", { center: SAN_DIEGO, zoom: 11, zoomControl: true, doubleClickZoom: false });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19,
    }).addTo(map);

    L.tileLayer("https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openseamap.org">OpenSeaMap</a>',
      maxZoom: 18,
      opacity: 0.8,
    }).addTo(map);

    // ── Map nav controls (Fit All Boats, Center on SD) ────────────────────────

    const NavControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd() {
        const div = L.DomUtil.create('div', 'map-nav-control');
        L.DomEvent.disableClickPropagation(div);

        const fitBtn = L.DomUtil.create('button', 'map-nav-btn', div);
        fitBtn.innerHTML = '⊡ Fit All Boats';
        fitBtn.title = 'Zoom to show all active boats';
        L.DomEvent.on(fitBtn, 'click', e => { L.DomEvent.stop(e); fitAllBoats(); });

        const centerBtn = L.DomUtil.create('button', 'map-nav-btn', div);
        centerBtn.innerHTML = '⌖ San Diego';
        centerBtn.title = 'Center on San Diego';
        L.DomEvent.on(centerBtn, 'click', e => { L.DomEvent.stop(e); map.setView(SAN_DIEGO, 11); });

        return div;
      },
    });
    new NavControl().addTo(map);

    // ── Nautical scale bar ────────────────────────────────────────────────────

    const NauticalScaleControl = L.Control.extend({
      options: { position: 'bottomleft' },
      onAdd(map) {
        this._map = map;
        this._div = L.DomUtil.create('div', 'nautical-scale-control');
        this._update();
        map.on('zoomend moveend', this._update, this);
        return this._div;
      },
      onRemove(map) {
        map.off('zoomend moveend', this._update, this);
      },
      _update() {
        const maxPx = 110;
        const y = this._map.getSize().y / 2;
        const left  = this._map.containerPointToLatLng([0, y]);
        const right = this._map.containerPointToLatLng([maxPx, y]);
        const nmTotal = haversineNm(left.lat, left.lng, right.lat, right.lng);

        const steps = [0.05, 0.1, 0.25, 0.5, 1, 2, 5, 10, 25, 50, 100, 200];
        const niceNm = steps.find(s => s >= nmTotal * 0.6) || 200;
        const px = Math.round(niceNm / nmTotal * maxPx);

        this._div.innerHTML =
          `<div class="ns-bar" style="width:${px}px"></div>` +
          `<div class="ns-label">${niceNm} nm</div>`;
      },
    });
    new NauticalScaleControl().addTo(map);

    // ── Compass rose ──────────────────────────────────────────────────────────

    const CompassControl = L.Control.extend({
      options: { position: 'bottomright' },
      onAdd() {
        const div = L.DomUtil.create('div', 'compass-rose-control');
        div.style.pointerEvents = 'none';
        div.innerHTML = `
          <svg width="56" height="56" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
            <circle cx="28" cy="28" r="26" fill="rgba(11,26,46,0.82)" stroke="#1e3a5a" stroke-width="1.5"/>
            <!-- N arrow -->
            <path d="M28 6 L24 24 L28 21 L32 24 Z" fill="#f0f4f8"/>
            <!-- S arrow -->
            <path d="M28 50 L24 32 L28 35 L32 32 Z" fill="#3a5a78"/>
            <!-- E arrow -->
            <path d="M50 28 L32 24 L35 28 L32 32 Z" fill="#3a5a78"/>
            <!-- W arrow -->
            <path d="M6 28 L24 24 L21 28 L24 32 Z" fill="#3a5a78"/>
            <!-- Center -->
            <circle cx="28" cy="28" r="3" fill="#c9a227"/>
            <!-- Labels -->
            <text x="28" y="5" text-anchor="middle" dominant-baseline="hanging" fill="#f0f4f8" font-size="8" font-weight="700" font-family="Barlow Condensed,sans-serif" letter-spacing="0.5">N</text>
            <text x="28" y="52" text-anchor="middle" dominant-baseline="auto" fill="#5a7a96" font-size="7" font-family="Barlow Condensed,sans-serif">S</text>
            <text x="54" y="30" text-anchor="end" fill="#5a7a96" font-size="7" font-family="Barlow Condensed,sans-serif">E</text>
            <text x="2" y="30" text-anchor="start" fill="#5a7a96" font-size="7" font-family="Barlow Condensed,sans-serif">W</text>
          </svg>`;
        return div;
      },
    });
    new CompassControl().addTo(map);

    // State
    const boatLayers = {};
    const savedPointLayers = [];
    const hiddenBoats = new Set();
    let filterStart = null;
    let filterEnd = null;
    let filterActive = false;
    let soloMmsi = null;
    let boats = [];
    let cachedLatestMap = {};
    let cachedActiveBoats = [];
    let refreshInterval = null;
    let fishingGroundsVisible = false;
    const fishingGroundLayers = [];
    const coordTip = L.tooltip({ className: "coord-tip", direction: "right", offset: [14, 0] });

    const FISHING_GROUNDS = [
      { name: "43 Fathom Bank",  lat: 32.55,  lon: -117.48 },
      { name: "9 Mile Bank",     lat: 32.58,  lon: -117.47 },
      { name: "60 Mile Bank",    lat: 31.88,  lon: -118.58 },
      { name: "Cortez Bank",     lat: 31.68,  lon: -119.05 },
      { name: "Tanner Bank",     lat: 32.70,  lon: -119.08 },
    ];

    // ── Utilities ────────────────────────────────────────────────────────────

    function haversineNm(lat1, lon1, lat2, lon2) {
      const R = 3440.065;
      const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
      const dφ = (lat2 - lat1) * Math.PI / 180;
      const dλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dφ / 2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(dλ / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function setStatus(state, text) {
      const dot = document.getElementById("status-dot");
      dot.className = state || "";
      document.getElementById("status-text").textContent = text;
    }

    function toggleManager() {
      const panel = document.getElementById("manager-panel");
      const btn = document.getElementById("manage-btn");
      const open = panel.classList.toggle("open");
      btn.classList.toggle("active", open);
    }

    function formatTs(ts) {
      if (!ts) return "";
      return new Date(ts).toLocaleString(undefined, {
        month: "short", day: "numeric",
        hour: "2-digit", minute: "2-digit",
        timeZoneName: "short",
      });
    }

    function formatLastSeen(timestamp) {
      if (!timestamp) return "No data yet";
      const diffMin = Math.floor((Date.now() - new Date(timestamp).getTime()) / 60000);
      if (diffMin < 1) return "Just now";
      if (diffMin < 60) return `${diffMin} min ago`;
      const diffHrs = Math.floor(diffMin / 60);
      if (diffHrs < 24) return `${diffHrs} hr${diffHrs !== 1 ? "s" : ""} ago`;
      const diffDays = Math.floor(diffHrs / 24);
      return `${diffDays} day${diffDays !== 1 ? "s" : ""} ago`;
    }

    function applyVisibility() {
      for (const [mmsi, layers] of Object.entries(boatLayers)) {
        let visible;
        if (soloMmsi !== null) {
          visible = mmsi === soloMmsi;
        } else {
          visible = !hiddenBoats.has(mmsi);
        }
        if (visible) {
          if (!map.hasLayer(layers.polyline)) layers.polyline.addTo(map);
          if (!map.hasLayer(layers.marker)) layers.marker.addTo(map);
        } else {
          layers.polyline.remove();
          layers.marker.remove();
        }
      }
    }

    function fitAllBoats() {
      const visiblePolylines = [];
      for (const [mmsi, layers] of Object.entries(boatLayers)) {
        if (soloMmsi !== null && mmsi !== soloMmsi) continue;
        if (soloMmsi === null && hiddenBoats.has(mmsi)) continue;
        visiblePolylines.push(layers.polyline);
      }
      if (visiblePolylines.length === 0) return;
      const group = L.featureGroup(visiblePolylines);
      map.fitBounds(group.getBounds(), { padding: [50, 50] });
    }

    function nearestPoint(positions, lat, lng) {
      let nearest = null, minDist = Infinity;
      for (const p of positions) {
        const d = (p.lat - lat) ** 2 + (p.lon - lng) ** 2;
        if (d < minDist) { minDist = d; nearest = p; }
      }
      return nearest;
    }

    function makeBoatIcon(color, heading) {
      const deg = (heading != null && heading !== 511) ? heading : 0;
      return L.divIcon({
        className: "",
        html: `<div style="width:30px;height:30px;transform:rotate(${deg}deg);transform-origin:center">
          <svg width="30" height="30" viewBox="0 0 30 30">
            <path d="M15 3 L10 27 L15 22 L20 27 Z"
                  fill="${color}" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
            <circle cx="15" cy="15" r="2.5" fill="white" opacity="0.75"/>
          </svg>
        </div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -16],
      });
    }

    function makePinIcon() {
      return L.divIcon({
        className: "",
        html: `<svg width="22" height="28" viewBox="0 0 22 28">
          <path d="M11 0C6.03 0 2 4.03 2 9c0 6.75 9 19 9 19s9-12.25 9-19c0-4.97-4.03-9-9-9z"
                fill="#c9a227" stroke="#fff" stroke-width="1.5"/>
          <circle cx="11" cy="9" r="3.5" fill="#fff"/>
        </svg>`,
        iconSize: [22, 28],
        iconAnchor: [11, 28],
        popupAnchor: [0, -30],
      });
    }

    function makeFishingGroundIcon() {
      return L.divIcon({
        className: "",
        html: `<svg width="12" height="12" viewBox="0 0 12 12">
          <circle cx="6" cy="6" r="5" fill="#c9a22740" stroke="#c9a227" stroke-width="1.5"/>
        </svg>`,
        iconSize: [12, 12],
        iconAnchor: [6, 6],
      });
    }

    function removeBoatFromMap(mmsi) {
      const layers = boatLayers[mmsi];
      if (!layers) return;
      layers.polyline.remove();
      layers.marker.remove();
      delete boatLayers[mmsi];
    }

    // ── Fishing grounds ──────────────────────────────────────────────────────

    function toggleFishingGrounds() {
      const btn = document.getElementById("fishing-toggle");
      fishingGroundsVisible = !fishingGroundsVisible;
      btn.classList.toggle("active", fishingGroundsVisible);

      if (fishingGroundsVisible) {
        for (const ground of FISHING_GROUNDS) {
          const marker = L.marker([ground.lat, ground.lon], {
            icon: makeFishingGroundIcon(),
            zIndexOffset: -20,
          }).addTo(map);
          marker.bindTooltip(ground.name, {
            permanent: true,
            direction: "top",
            offset: [0, -8],
            className: "fishing-ground-label",
          });
          fishingGroundLayers.push(marker);
        }
      } else {
        for (const m of fishingGroundLayers) m.remove();
        fishingGroundLayers.length = 0;
      }
    }

    // ── Auto-refresh ─────────────────────────────────────────────────────────

    function startAutoRefresh() {
      stopAutoRefresh();
      refreshInterval = setInterval(refresh, 30000);
    }

    function stopAutoRefresh() {
      if (refreshInterval !== null) {
        clearInterval(refreshInterval);
        refreshInterval = null;
      }
    }

    // ── Date bar UI ──────────────────────────────────────────────────────────

    function updateDateBarUI() {
      const noMsg = document.getElementById("no-vessel-msg");
      const dateInputs = document.getElementById("date-inputs");
      const liveModeBtn = document.getElementById("live-mode-btn");
      if (soloMmsi) {
        noMsg.style.display = "none";
        dateInputs.style.display = "flex";
        liveModeBtn.style.display = filterActive ? "inline-block" : "none";
      } else {
        noMsg.style.display = "";
        dateInputs.style.display = "none";
        liveModeBtn.style.display = "none";
      }
    }

    async function applyFilter() {
      if (!soloMmsi) return;
      filterStart = document.getElementById("date-start").value || null;
      filterEnd = document.getElementById("date-end").value || null;
      filterActive = !!(filterStart || filterEnd);
      if (filterActive) {
        stopAutoRefresh();
        for (const mmsi of Object.keys(boatLayers)) {
          if (mmsi !== soloMmsi) removeBoatFromMap(mmsi);
        }
        const boat = boats.find(b => b.mmsi === soloMmsi);
        if (boat) {
          await updateBoatOnMap(boat);
          applyVisibility();
        }
      } else {
        enterLiveMode();
        return;
      }
      updateDateBarUI();
    }

    function enterLiveMode() {
      filterActive = false;
      filterStart = null;
      filterEnd = null;
      const startEl = document.getElementById("date-start");
      const endEl = document.getElementById("date-end");
      if (startEl) startEl.value = "";
      if (endEl) endEl.value = "";
      updateDateBarUI();
      startAutoRefresh();
      refresh();
    }

    // ── Boat track rendering ─────────────────────────────────────────────────

    async function updateBoatOnMap(boat) {
      const useFilter = filterActive && boat.mmsi === soloMmsi;
      const params = new URLSearchParams();
      if (useFilter && filterStart) params.set("start", filterStart);
      if (useFilter && filterEnd) params.set("end", filterEnd);
      if (useFilter && (filterStart || filterEnd)) params.set("limit", "5000");
      const qs = params.toString();
      const url = `/api/positions/${boat.mmsi}` + (qs ? "?" + qs : "");

      let positions;
      try {
        const res = await fetch(url);
        positions = await res.json();
      } catch { return null; }

      if (positions.length === 0) return null;

      const ordered = [...positions].reverse();
      const latLngs = ordered.map(p => [p.lat, p.lon]);

      removeBoatFromMap(boat.mmsi);

      const polyline = L.polyline(latLngs, {
        color: boat.color,
        weight: 4,
        opacity: 0.9,
      }).addTo(map);

      polyline.on("mousemove", e => {
        const { lat, lng } = e.latlng;
        const near = nearestPoint(ordered, lat, lng);
        const tsLine = near?.timestamp
          ? `<br><span style="color:#7ab">${formatTs(near.timestamp)}</span>`
          : "";
        const spdLine = near?.speed != null
          ? `<br><span style="color:#888">${near.speed.toFixed(1)} kn</span>`
          : "";
        coordTip
          .setLatLng(e.latlng)
          .setContent(`${lat.toFixed(5)}, ${lng.toFixed(5)}${tsLine}${spdLine}`)
          .addTo(map);
      });
      polyline.on("mouseout", () => coordTip.remove());

      const latest = ordered[ordered.length - 1];
      const distNm = haversineNm(latest.lat, latest.lon, POINT_LOMA[0], POINT_LOMA[1]).toFixed(1);

      const popupContent = document.createElement('div');
      popupContent.className = 'boat-popup';
      popupContent.innerHTML = `
        <div class="bp-name" style="color:${boat.color}">${boat.name}</div>
        <div class="bp-row"><span class="bp-label">Speed</span><span class="bp-val">${latest.speed?.toFixed(1) ?? '—'} kn</span></div>
        <div class="bp-row"><span class="bp-label">Heading</span><span class="bp-val">${latest.heading != null && latest.heading !== 511 ? latest.heading + '°' : '—'}</span></div>
        <div class="bp-row"><span class="bp-label">Dist (Pt Loma)</span><span class="bp-val">${distNm} nm</span></div>
        <div class="bp-row"><span class="bp-label">Last seen</span><span class="bp-val">${formatLastSeen(latest.timestamp)}</span></div>
      `;

      const marker = L.marker([latest.lat, latest.lon], {
        icon: makeBoatIcon(boat.color, latest.heading),
        zIndexOffset: 100,
      }).addTo(map).bindPopup(popupContent, { maxWidth: 220 });

      marker.on('mouseover', function() { this.openPopup(); });

      marker.bindTooltip(boat.name, {
        permanent: true,
        direction: "top",
        offset: [0, -16],
        className: "boat-name-label",
      });

      boatLayers[boat.mmsi] = { polyline, marker, positions: ordered };
      return latest;
    }

    // ── Saved points ─────────────────────────────────────────────────────────

    async function loadSavedPoints() {
      for (const m of savedPointLayers) m.remove();
      savedPointLayers.length = 0;
      try {
        const res = await fetch("/api/points");
        const points = await res.json();
        for (const pt of points) {
          const div = document.createElement("div");
          div.className = "point-popup";
          div.innerHTML = `
            <span class="pt-name">${pt.name || "Saved Point"}</span>
            <div class="pt-coords">${pt.lat.toFixed(6)}, ${pt.lon.toFixed(6)}</div>
            ${pt.notes ? `<div class="pt-notes">${pt.notes}</div>` : ""}
            <div class="pt-date">${new Date(pt.created_at).toLocaleString()}</div>
          `;
          const marker = L.marker([pt.lat, pt.lon], {
            icon: makePinIcon(), zIndexOffset: -10,
          }).addTo(map).bindPopup(div);
          savedPointLayers.push(marker);
        }
      } catch {}
    }

    // ── Click-to-save ────────────────────────────────────────────────────────

    map.on("dblclick", function(e) {
      const { lat, lng } = e.latlng;
      const div = document.createElement("div");
      div.className = "save-form";
      div.innerHTML = `
        <div class="sf-coords">${lat.toFixed(6)}, ${lng.toFixed(6)}</div>
        <div class="sf-field">
          <label class="sf-label">Note name</label>
          <input type="text" class="sf-name" placeholder="My waypoint" />
        </div>
        <div class="sf-field">
          <label class="sf-label">Notes</label>
          <textarea class="sf-notes" rows="3" placeholder="Observations..."></textarea>
        </div>
        <button class="sf-btn">Save</button>
        <div class="sf-err"></div>
      `;
      const nameInput = div.querySelector(".sf-name");
      const notesInput = div.querySelector(".sf-notes");
      const saveBtn = div.querySelector(".sf-btn");
      const errDiv = div.querySelector(".sf-err");
      saveBtn.addEventListener("click", async () => {
        const name = nameInput.value.trim();
        const notes = notesInput.value.trim();
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving...";
        try {
          const res = await fetch("/api/points", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ lat, lon: lng, name, notes }),
          });
          if (res.ok) { map.closePopup(); await loadSavedPoints(); }
          else { errDiv.textContent = "Save failed"; saveBtn.disabled = false; saveBtn.textContent = "Save"; }
        } catch {
          errDiv.textContent = "Network error"; saveBtn.disabled = false; saveBtn.textContent = "Save";
        }
      });
      L.popup({ maxWidth: 260 }).setLatLng(e.latlng).setContent(div).openOn(map);
    });

    // ── Sidebar rendering ────────────────────────────────────────────────────

    function renderVesselSidebar(activeBoats, latestMap) {
      const list = document.getElementById("boat-list");
      list.innerHTML = "";

      if (activeBoats.length === 0) {
        list.innerHTML = '<div id="no-boats">No vessels tracked</div>';
        return;
      }

      // Sort most recently seen first
      const sorted = [...activeBoats].sort((a, b) => {
        const tA = latestMap[a.mmsi]?.timestamp;
        const tB = latestMap[b.mmsi]?.timestamp;
        if (!tA && !tB) return 0;
        if (!tA) return 1;
        if (!tB) return -1;
        return new Date(tB) - new Date(tA);
      });

      const ONE_HOUR_MS = 60 * 60 * 1000;
      const now = Date.now();

      for (const boat of sorted) {
        const latest = latestMap[boat.mmsi];
        const card = document.createElement("div");
        card.className = "boat-card" + (soloMmsi === boat.mmsi ? " solo-active" : "");

        const speedText = latest?.speed != null ? `${latest.speed.toFixed(1)} kn` : "—";
        const lastSeenText = formatLastSeen(latest?.timestamp);
        const distText = latest
          ? haversineNm(latest.lat, latest.lon, POINT_LOMA[0], POINT_LOMA[1]).toFixed(1) + " nm"
          : "—";

        const isRecent = latest?.timestamp &&
          (now - new Date(latest.timestamp).getTime()) < ONE_HOUR_MS;
        const isHidden = hiddenBoats.has(boat.mmsi);

        // Build color options HTML
        const hasExactMatch = COLOR_OPTIONS.some(c => c.value.toLowerCase() === boat.color.toLowerCase());
        const customOpt = !hasExactMatch
          ? `<option value="${boat.color}" selected>Custom (${boat.color})</option>` : '';
        const colorOptsHtml = customOpt + COLOR_OPTIONS.map(c =>
          `<option value="${c.value}"${!customOpt && c.value.toLowerCase() === boat.color.toLowerCase() ? ' selected' : ''}>${c.name}</option>`
        ).join('');

        card.innerHTML = `
          <div class="activity-dot ${isRecent ? 'act-green' : 'act-red'}" title="${isRecent ? 'Seen in last hour' : 'Not seen recently'}"></div>
          <div class="boat-dot" style="background:${boat.color}"></div>
          <div class="boat-info">
            <div class="boat-name">${boat.name}</div>
            <div class="boat-mmsi">${boat.mmsi}</div>
            <select class="color-select" title="Track color">${colorOptsHtml}</select>
            <div class="boat-last-seen">${lastSeenText}</div>
          </div>
          <div class="boat-speed-dist">
            <div class="boat-speed">${speedText}</div>
            <div class="boat-dist">${distText}</div>
          </div>
          <button class="eye-btn${isHidden ? ' eye-hidden' : ''}" title="${isHidden ? 'Show on map' : 'Hide on map'}">${isHidden ? EYE_OFF_SVG : EYE_SVG}</button>
        `;

        const dot = card.querySelector(".boat-dot");
        const colorSelect = card.querySelector(".color-select");
        const eyeBtn = card.querySelector(".eye-btn");

        colorSelect.addEventListener("click", e => { e.stopPropagation(); });

        colorSelect.addEventListener("change", async e => {
          e.stopPropagation();
          const newColor = colorSelect.value;
          dot.style.background = newColor;
          try {
            const res = await fetch(`/api/boats/${boat.mmsi}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ color: newColor }),
            });
            if (!res.ok) throw new Error();
            boat.color = newColor;
            const layers = boatLayers[boat.mmsi];
            if (layers) {
              layers.polyline.setStyle({ color: newColor });
              const latestPos = layers.positions[layers.positions.length - 1];
              layers.marker.setIcon(makeBoatIcon(newColor, latestPos?.heading));
            }
          } catch {
            dot.style.background = boat.color;
            colorSelect.value = boat.color;
          }
        });

        eyeBtn.addEventListener("click", e => {
          e.stopPropagation();
          if (hiddenBoats.has(boat.mmsi)) {
            hiddenBoats.delete(boat.mmsi);
          } else {
            hiddenBoats.add(boat.mmsi);
          }
          applyVisibility();
          renderVesselSidebar(cachedActiveBoats, cachedLatestMap);
        });

        card.addEventListener("click", () => {
          if (soloMmsi === boat.mmsi) {
            soloMmsi = null;
            if (filterActive) { enterLiveMode(); return; }
          } else {
            soloMmsi = boat.mmsi;
            const layer = boatLayers[boat.mmsi];
            if (layer?.marker) map.setView(layer.marker.getLatLng(), 13);
          }
          applyVisibility();
          renderVesselSidebar(cachedActiveBoats, cachedLatestMap);
          updateDateBarUI();
        });

        list.appendChild(card);
      }
    }

    // ── Manager panel rendering ──────────────────────────────────────────────

    function renderManagerList(boatList) {
      const list = document.getElementById("manager-boat-list");
      list.innerHTML = "";
      if (boatList.length === 0) {
        list.innerHTML = '<div style="font-size:13px;color:var(--dim);padding:6px 0">No vessels added yet</div>';
        return;
      }
      for (const boat of boatList) {
        const item = document.createElement("div");
        item.className = "manager-boat-item";
        item.innerHTML = `
          <div class="color-swatch" style="background:${boat.color}"></div>
          <div class="manager-boat-name">
            <div class="name">${boat.name}</div>
            <div class="mmsi">${boat.mmsi}</div>
          </div>
          <label class="toggle-switch" title="${boat.active ? "Active" : "Inactive"}">
            <input type="checkbox" ${boat.active ? "checked" : ""} />
            <span class="toggle-slider"></span>
          </label>
          <button class="btn-sm backfill-btn" title="Fetch last 24h of positions">Backfill</button>
          <button class="btn-sm danger delete-btn" title="Delete vessel">Del</button>
        `;
        const checkbox = item.querySelector("input[type=checkbox]");
        checkbox.addEventListener("change", async () => {
          checkbox.disabled = true;
          try {
            const res = await fetch(`/api/boats/${boat.mmsi}`, {
              method: "PUT", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ active: checkbox.checked }),
            });
            if (res.ok) await refresh(); else checkbox.checked = !checkbox.checked;
          } finally { checkbox.disabled = false; }
        });
        const backfillBtn = item.querySelector(".backfill-btn");
        backfillBtn.addEventListener("click", async () => {
          backfillBtn.textContent = "..."; backfillBtn.disabled = true;
          try {
            const res = await fetch(`/api/boats/${boat.mmsi}/backfill`, { method: "POST" });
            const data = await res.json();
            backfillBtn.textContent = `+${data.inserted ?? 0}`;
            setTimeout(() => { backfillBtn.textContent = "Backfill"; }, 3000);
            if ((data.inserted ?? 0) > 0) await refresh();
          } catch {
            backfillBtn.textContent = "Err";
            setTimeout(() => { backfillBtn.textContent = "Backfill"; }, 2000);
          } finally { backfillBtn.disabled = false; }
        });
        const deleteBtn = item.querySelector(".delete-btn");
        deleteBtn.addEventListener("click", async () => {
          if (!confirm(`Delete "${boat.name}"? This will also remove all recorded positions.`)) return;
          deleteBtn.disabled = true;
          try {
            const res = await fetch(`/api/boats/${boat.mmsi}`, { method: "DELETE" });
            if (res.ok) { removeBoatFromMap(boat.mmsi); await refresh(); }
          } finally { deleteBtn.disabled = false; }
        });
        list.appendChild(item);
      }
    }

    // ── Main refresh ─────────────────────────────────────────────────────────

    async function refresh() {
      if (filterActive) return;
      try {
        const res = await fetch("/api/boats");
        boats = await res.json();
      } catch {
        setStatus("error", "Connection error");
        return;
      }
      const currentMmsis = new Set(boats.map(b => b.mmsi));
      for (const mmsi of Object.keys(boatLayers)) {
        if (!currentMmsis.has(mmsi)) removeBoatFromMap(mmsi);
      }
      cachedLatestMap = {};
      let anyPosition = false;
      const activeSet = new Set(boats.filter(b => b.active).map(b => b.mmsi));
      if (soloMmsi && !activeSet.has(soloMmsi)) soloMmsi = null;
      for (const boat of boats) {
        if (!boat.active) {
          removeBoatFromMap(boat.mmsi);
        } else {
          const latest = await updateBoatOnMap(boat);
          cachedLatestMap[boat.mmsi] = latest;
          if (latest) anyPosition = true;
        }
      }
      cachedActiveBoats = boats.filter(b => b.active);
      renderVesselSidebar(cachedActiveBoats, cachedLatestMap);
      renderManagerList(boats);
      applyVisibility();
      updateDateBarUI();
      if (anyPosition) {
        setStatus("live", "Live");
      } else if (boats.some(b => b.active)) {
        setStatus(null, "Waiting for data...");
      } else {
        setStatus(null, "No active vessels");
      }
    }

    // ── Add boat form ────────────────────────────────────────────────────────

    document.getElementById("new-boat-color").addEventListener("input", e => {
      document.getElementById("new-boat-color-label").textContent = e.target.value;
    });

    document.getElementById("add-boat-form").addEventListener("submit", async e => {
      e.preventDefault();
      const name = document.getElementById("new-boat-name").value.trim();
      const mmsi = document.getElementById("new-boat-mmsi").value.trim();
      const color = document.getElementById("new-boat-color").value;
      const errEl = document.getElementById("add-error");
      const btn = document.getElementById("add-boat-btn");
      errEl.textContent = "";
      btn.disabled = true;
      btn.textContent = "Adding...";
      try {
        const res = await fetch("/api/boats", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, mmsi, color }),
        });
        if (res.ok) {
          document.getElementById("new-boat-name").value = "";
          document.getElementById("new-boat-mmsi").value = "";
          document.getElementById("new-boat-color").value = "#c9a227";
          document.getElementById("new-boat-color-label").textContent = "#c9a227";
          await refresh();
        } else {
          const data = await res.json();
          errEl.textContent = data.detail || "Failed to add vessel";
        }
      } catch {
        errEl.textContent = "Network error";
      } finally {
        btn.disabled = false;
        btn.textContent = "Add Vessel";
      }
    });

    // ── Marine widgets ───────────────────────────────────────────────────────

    async function loadTide() {
      const url = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?station=9410170&product=water_level&datum=MLLW&time_zone=lst_ldt&units=english&format=json&date=today`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const readings = data.data;
        if (!readings || readings.length === 0) throw new Error();
        const latest = readings[readings.length - 1];
        const ft = parseFloat(latest.v).toFixed(1);
        document.getElementById("tide-val").classList.remove("loading");
        document.getElementById("tide-val").innerHTML = `${ft} <span class="widget-unit">ft</span>`;
        document.getElementById("tide-sub").textContent = "MLLW · SD Bay";
      } catch {
        document.getElementById("tide-val").textContent = "N/A";
        document.getElementById("tide-val").classList.remove("loading");
      }
    }

    async function loadBuoyData() {
      const url = "https://www.ndbc.noaa.gov/data/realtime2/46225.txt";
      try {
        const res = await fetch(url);
        const text = await res.text();
        const lines = text.trim().split('\n');
        if (lines.length < 3) throw new Error();
        const parts = lines[2].trim().split(/\s+/);
        const wdir = parts[5];
        const wspd = parts[6];
        const wtmp = parts[14];

        const wspdKts = wspd !== 'MM' ? (parseFloat(wspd) * 1.944).toFixed(0) : null;
        const wtmpF   = wtmp !== 'MM' ? (parseFloat(wtmp) * 9/5 + 32).toFixed(1) : null;
        const cardinals = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
        const wdirCard = wdir !== 'MM' ? cardinals[Math.round(parseInt(wdir) / 22.5) % 16] : null;

        if (wspdKts !== null) {
          document.getElementById("wind-val").innerHTML = `${wspdKts} <span class="widget-unit">kts</span>`;
          document.getElementById("wind-val").classList.remove("loading");
          document.getElementById("wind-sub").textContent = wdirCard ? `From ${wdirCard}` : "46225";
        } else {
          document.getElementById("wind-val").textContent = "N/A";
          document.getElementById("wind-val").classList.remove("loading");
        }

        if (wtmpF !== null) {
          document.getElementById("sst-val").innerHTML = `${wtmpF} <span class="widget-unit">°F</span>`;
          document.getElementById("sst-val").classList.remove("loading");
          document.getElementById("sst-sub").textContent = "Buoy 46225";
        } else {
          document.getElementById("sst-val").textContent = "N/A";
          document.getElementById("sst-val").classList.remove("loading");
        }
      } catch {
        document.getElementById("wind-val").textContent = "N/A";
        document.getElementById("wind-val").classList.remove("loading");
        document.getElementById("sst-val").textContent = "N/A";
        document.getElementById("sst-val").classList.remove("loading");
      }
    }

    function loadSunTimes() {
      const lat = 32.7157, lon = -117.1611;
      const now = new Date();
      const { rise, set } = sunCalc(now, lat, lon);
      const fmt = d => d ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—';
      document.getElementById("sun-val").innerHTML = `${fmt(rise)}`;
      document.getElementById("sun-val").classList.remove("loading");
      document.getElementById("sun-sub").textContent = `Set ${fmt(set)}`;
    }

    function sunCalc(date, lat, lon) {
      const rad = Math.PI / 180;
      const J2000 = 2451545.0;
      const toJD = d => (d.getTime() / 86400000) + 2440587.5;

      const jd = toJD(date);
      const n = Math.ceil(jd - J2000 - 0.0009 + lon / 360);
      const Jstar = J2000 + 0.0009 - lon / 360 + n;
      const M = (357.5291 + 0.98560028 * (Jstar - J2000)) % 360;
      const C = 1.9148 * Math.sin(M * rad) + 0.0200 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
      const λ = (M + C + 180 + 102.9372) % 360;
      const Jtransit = Jstar + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * λ * rad);
      const sinδ = Math.sin(λ * rad) * Math.sin(23.4397 * rad);
      const cosH = (Math.sin(-0.8333 * rad) - Math.sin(lat * rad) * sinδ) / (Math.cos(lat * rad) * Math.cos(Math.asin(sinδ)));
      if (cosH < -1 || cosH > 1) return { rise: null, set: null };
      const H = Math.acos(cosH) / rad;
      const fromJD = j => new Date((j - 2440587.5) * 86400000);
      return {
        rise: fromJD(Jtransit - H / 360),
        set: fromJD(Jtransit + H / 360),
      };
    }

    async function loadWidgets() {
      loadSunTimes();
      await Promise.allSettled([loadTide(), loadBuoyData()]);
    }

    // ── Initial load ─────────────────────────────────────────────────────────

    refresh();
    loadSavedPoints();
    loadWidgets();
    startAutoRefresh();
    setInterval(loadWidgets, 15 * 60 * 1000);
  </script>
</body>
</html>
