<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIS Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      padding: 10px 16px;
      background: #1a1d27;
      border-bottom: 1px solid #2a2d3a;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      min-height: 48px;
    }

    header h1 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    header h1 span { color: #4a9eff; }

    #manage-btn {
      background: #2a2d3a;
      border: 1px solid #3a3d4a;
      border-radius: 6px;
      color: #ccc;
      padding: 5px 12px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #manage-btn:hover { background: #3a3d4a; color: #fff; }
    #manage-btn.active { background: #4a9eff22; border-color: #4a9eff; color: #4a9eff; }

    #status {
      margin-left: auto;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #888;
      flex-shrink: 0;
    }
    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #444;
      flex-shrink: 0;
    }
    #status-dot.live { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
    #status-dot.error { background: #e74c3c; }

    #logout-form { margin-left: 8px; flex-shrink: 0; }
    #logout-btn {
      background: transparent;
      border: 1px solid #3a3d4a;
      border-radius: 6px;
      color: #666;
      padding: 5px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    #logout-btn:hover { color: #e74c3c; border-color: #e74c3c; }

    /* ── Date bar ── */
    #date-bar {
      background: #13151f;
      border-bottom: 1px solid #1e2130;
      padding: 7px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      flex-wrap: wrap;
      min-height: 42px;
    }

    #no-vessel-msg {
      font-size: 13px;
      color: #444;
      font-style: italic;
    }

    #date-inputs {
      display: none;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .date-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .date-group label {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
    }
    .date-group input[type="datetime-local"] {
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      color: #e0e0e0;
      padding: 4px 8px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
      color-scheme: dark;
    }
    .date-group input[type="datetime-local"]:focus { border-color: #4a9eff; }

    #load-track-btn {
      background: #4a9eff;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    #load-track-btn:hover { background: #3a8eef; }

    #live-mode-btn {
      background: #27ae60;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: none;
    }
    #live-mode-btn:hover { background: #219a52; }

    /* ── Map ── */
    #map { flex: 1; min-height: 0; }

    /* ── Manager panel (left overlay, desktop) ── */
    #manager-panel {
      position: absolute;
      top: 100px;
      left: 16px;
      z-index: 1000;
      background: #1a1d27ee;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      padding: 14px 16px;
      width: 280px;
      backdrop-filter: blur(8px);
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      display: none;
    }
    #manager-panel.open { display: block; }

    #drawer-handle {
      display: none;
      width: 36px;
      height: 4px;
      background: #3a3d4a;
      border-radius: 2px;
      margin: 0 auto 12px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      margin-bottom: 14px;
    }
    .panel-header h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #888;
      flex: 1;
    }
    .panel-close {
      background: none;
      border: none;
      color: #555;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }
    .panel-close:hover { color: #e74c3c; }

    .manager-section { margin-bottom: 18px; }
    .manager-section h3 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #444;
      margin-bottom: 10px;
    }

    .form-group { margin-bottom: 10px; }
    .form-group label {
      font-size: 12px;
      color: #888;
      display: block;
      margin-bottom: 4px;
    }
    .form-group input[type="text"] {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      color: #e0e0e0;
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
    }
    .form-group input[type="text"]:focus { border-color: #4a9eff; }

    .form-color-row { display: flex; align-items: center; gap: 10px; }
    .form-group input[type="color"] {
      width: 36px;
      height: 28px;
      border: 1px solid #2a2d3a;
      border-radius: 5px;
      background: #0f1117;
      cursor: pointer;
      padding: 2px;
      flex-shrink: 0;
    }
    #new-boat-color-label { font-size: 12px; color: #666; font-family: monospace; }

    .btn-primary {
      width: 100%;
      background: #4a9eff;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-primary:hover { background: #3a8eef; }
    .btn-primary:disabled { background: #1a3a6f; color: #4a6fa0; cursor: default; }

    .form-error { font-size: 12px; color: #e74c3c; margin-top: 6px; min-height: 16px; }

    .manager-boat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 4px;
      border-bottom: 1px solid #1e2130;
    }
    .manager-boat-item:last-child { border-bottom: none; }

    .color-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    .manager-boat-name { flex: 1; min-width: 0; }
    .manager-boat-name .name {
      font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .manager-boat-name .mmsi { font-size: 11px; color: #555; }

    .toggle-switch { position: relative; width: 32px; height: 17px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #333;
      border-radius: 17px;
      transition: background 0.2s;
    }
    .toggle-slider::before {
      content: "";
      position: absolute;
      width: 11px; height: 11px;
      left: 3px; bottom: 3px;
      background: #777;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle-switch input:checked + .toggle-slider { background: #4a9eff; }
    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(15px);
      background: #fff;
    }

    .btn-sm {
      background: none;
      border: 1px solid #2a2d3a;
      border-radius: 4px;
      color: #777;
      padding: 2px 6px;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .btn-sm:hover { color: #e0e0e0; border-color: #4a4d5a; }
    .btn-sm.danger:hover { color: #e74c3c; border-color: #e74c3c; }
    .btn-sm:disabled { opacity: 0.4; cursor: default; }

    /* ── Vessel sidebar (right overlay, desktop) ── */
    #sidebar {
      position: absolute;
      top: 100px;
      right: 16px;
      z-index: 1000;
      background: #1a1d27ee;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      padding: 14px 16px;
      width: 240px;
      backdrop-filter: blur(8px);
      max-height: calc(100vh - 120px);
      overflow-y: auto;
    }
    #sidebar h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #888;
      margin-bottom: 10px;
    }

    .boat-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 4px;
    }
    .boat-card:hover { background: #2a2d3a; }

    .boat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; cursor: pointer; transition: opacity 0.15s; margin-top: 4px; }
    .boat-dot:hover { opacity: 0.75; }
    .boat-info { flex: 1; min-width: 0; }
    .boat-name {
      font-size: 14px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .boat-mmsi { font-size: 11px; color: #666; margin-top: 1px; }
    .boat-last-seen { font-size: 11px; color: #555; margin-top: 2px; }

    .style-select {
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 4px;
      color: #777;
      font-size: 11px;
      padding: 2px 4px;
      cursor: pointer;
      outline: none;
      margin-top: 4px;
      display: block;
    }
    .style-select:focus { border-color: #4a9eff; }

    .boat-speed-dist {
      text-align: right;
      flex-shrink: 0;
    }
    .boat-speed { font-size: 12px; color: #aaa; }
    .boat-dist { font-size: 11px; color: #777; margin-top: 2px; white-space: nowrap; }

    .boat-card.solo-active {
      background: #1e2a3a;
      border: 1px solid #4a9eff55;
    }

    #no-boats { font-size: 13px; color: #555; text-align: center; padding: 8px 0; }

    /* ── Leaflet overrides ── */
    .leaflet-tooltip.boat-name-label {
      background: rgba(26, 29, 39, 0.92);
      border: 1px solid #2a2d3a;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 7px;
      box-shadow: none;
      white-space: nowrap;
    }
    .leaflet-tooltip.boat-name-label::before { display: none; }

    .leaflet-tooltip.coord-tip {
      background: rgba(15, 17, 23, 0.94);
      border: 1px solid #2a2d3a;
      border-radius: 5px;
      color: #aaa;
      font-size: 11px;
      font-family: monospace;
      padding: 5px 9px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      pointer-events: none;
      line-height: 1.6;
      white-space: nowrap;
    }
    .leaflet-tooltip.coord-tip::before { display: none; }

    /* Dark popup theme */
    .leaflet-popup-content-wrapper {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      color: #e0e0e0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }
    .leaflet-popup-tip { background: #1a1d27; }
    .leaflet-popup-close-button { color: #555 !important; font-size: 18px !important; top: 6px !important; right: 8px !important; }
    .leaflet-popup-close-button:hover { color: #e74c3c !important; }
    .leaflet-popup-content { margin: 12px 14px; line-height: 1.5; }

    /* Save note form inside popup */
    .save-form { min-width: 210px; }
    .save-form .sf-coords { font-size: 11px; color: #666; margin-bottom: 10px; font-family: monospace; }
    .save-form .sf-field { margin-bottom: 8px; }
    .save-form .sf-label { font-size: 12px; color: #888; display: block; margin-bottom: 3px; }
    .save-form input[type="text"],
    .save-form textarea {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 5px;
      color: #e0e0e0;
      padding: 5px 8px;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }
    .save-form input[type="text"]:focus,
    .save-form textarea:focus { border-color: #4a9eff; }
    .save-form textarea { resize: vertical; min-height: 60px; }
    .save-form .sf-btn {
      width: 100%;
      background: #4a9eff;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 2px;
    }
    .save-form .sf-btn:hover { background: #3a8eef; }
    .save-form .sf-btn:disabled { background: #1a3a6f; color: #4a6fa0; cursor: default; }
    .save-form .sf-err { font-size: 11px; color: #e74c3c; margin-top: 4px; min-height: 14px; }

    /* Saved point popup */
    .point-popup .pt-name { font-weight: 600; color: #f5a623; }
    .point-popup .pt-coords { font-size: 10px; color: #555; font-family: monospace; margin-top: 2px; }
    .point-popup .pt-notes { margin-top: 6px; font-size: 12px; color: #bbb; white-space: pre-wrap; word-break: break-word; }
    .point-popup .pt-date { font-size: 10px; color: #444; margin-top: 6px; }

    /* ── Mobile layout ── */
    @media (max-width: 767px) {
      header { padding: 8px 12px; }
      header h1 { font-size: 15px; }
      #status-text { display: none; }

      #date-bar { padding: 5px 10px; gap: 6px; }
      #date-inputs { gap: 6px; }
      .date-group { flex: 1; min-width: 0; }
      .date-group label { display: none; }
      .date-group input[type="datetime-local"] { font-size: 11px; padding: 4px 5px; width: 100%; }
      #load-track-btn { padding: 5px 10px; font-size: 12px; }
      #live-mode-btn { padding: 5px 10px; font-size: 12px; }

      /* Manager becomes bottom drawer */
      #manager-panel {
        position: fixed !important;
        top: auto !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        max-height: 72vh;
        border-radius: 14px 14px 0 0;
        border: 1px solid #2a2d3a;
        border-bottom: none;
        display: block !important;
        transform: translateY(110%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow-y: auto;
        z-index: 1100;
        padding: 8px 16px 24px;
      }
      #manager-panel.open { transform: translateY(0); }
      #drawer-handle { display: block; }

      /* Vessel sidebar becomes bottom strip */
      #sidebar {
        position: fixed !important;
        top: auto !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        height: 64px;
        max-height: none;
        border-radius: 0;
        border: none;
        border-top: 1px solid #2a2d3a;
        padding: 0 10px;
        display: flex !important;
        flex-direction: row;
        align-items: center;
        overflow: hidden;
        z-index: 900;
      }
      #sidebar h2 { display: none; }
      #boat-list {
        display: flex;
        flex-direction: row;
        gap: 6px;
        align-items: center;
        overflow-x: auto;
        overflow-y: hidden;
        flex: 1;
        padding: 6px 0;
        -webkit-overflow-scrolling: touch;
      }
      #no-boats { white-space: nowrap; font-size: 12px; padding: 0; }
      .boat-card {
        flex-shrink: 0;
        min-width: 100px;
        margin-bottom: 0;
        padding: 4px 8px;
        height: 48px;
        background: #1e2130;
        align-items: center;
      }
      .boat-name { font-size: 12px; }
      .boat-mmsi { font-size: 10px; }
      .boat-speed { font-size: 11px; }
      .boat-dist { display: none; }
      .boat-last-seen { display: none; }
      .style-select { display: none; }

      #map { margin-bottom: 64px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>AIS <span>Tracker</span></h1>
    <button id="manage-btn" onclick="toggleManager()">Manage</button>
    <div id="status">
      <div id="status-dot"></div>
      <span id="status-text">Loading...</span>
    </div>
    <form id="logout-form" method="post" action="/logout">
      <button type="submit" id="logout-btn">Sign out</button>
    </form>
  </header>

  <div id="date-bar">
    <span id="no-vessel-msg">Select a vessel first</span>
    <div id="date-inputs">
      <div class="date-group">
        <label for="date-start">From</label>
        <input type="datetime-local" id="date-start" />
      </div>
      <div class="date-group">
        <label for="date-end">To</label>
        <input type="datetime-local" id="date-end" />
      </div>
      <button id="load-track-btn" onclick="applyFilter()">Load Track</button>
      <button id="live-mode-btn" onclick="enterLiveMode()">Live Mode</button>
    </div>
  </div>

  <div id="map"></div>

  <!-- Boat Manager panel -->
  <div id="manager-panel">
    <div id="drawer-handle"></div>
    <div class="panel-header">
      <h2>Boat Manager</h2>
      <button class="panel-close" onclick="toggleManager()" title="Close">&times;</button>
    </div>

    <div class="manager-section">
      <h3>Add Vessel</h3>
      <form id="add-boat-form">
        <div class="form-group">
          <label for="new-boat-name">Boat Name</label>
          <input type="text" id="new-boat-name" placeholder="My Vessel" required />
        </div>
        <div class="form-group">
          <label for="new-boat-mmsi">MMSI</label>
          <input type="text" id="new-boat-mmsi" placeholder="338234916" required />
        </div>
        <div class="form-group">
          <label>Track Color</label>
          <div class="form-color-row">
            <input type="color" id="new-boat-color" value="#3388ff" />
            <span id="new-boat-color-label">#3388ff</span>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="add-boat-btn">Add Vessel</button>
        <div class="form-error" id="add-error"></div>
      </form>
    </div>

    <div class="manager-section">
      <h3>Tracked Vessels</h3>
      <div id="manager-boat-list"></div>
    </div>
  </div>

  <!-- Vessel sidebar -->
  <div id="sidebar">
    <h2>Vessels</h2>
    <div id="boat-list"><div id="no-boats">No vessels tracked</div></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const SAN_DIEGO = [32.7, -117.2];
    const POINT_LOMA = [32.6644, -117.2417];

    const map = L.map("map", { center: SAN_DIEGO, zoom: 11 });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19,
    }).addTo(map);

    // State
    const boatLayers = {};
    const savedPointLayers = [];
    let filterStart = null;
    let filterEnd = null;
    let filterActive = false;
    let soloMmsi = null;
    let boats = [];
    let cachedLatestMap = {};
    let refreshInterval = null;
    const coordTip = L.tooltip({ className: "coord-tip", direction: "right", offset: [14, 0] });

    // ── Utilities ────────────────────────────────────────────────────────────

    function haversineNm(lat1, lon1, lat2, lon2) {
      const R = 3440.065;
      const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
      const dφ = (lat2 - lat1) * Math.PI / 180;
      const dλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dφ / 2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(dλ / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function trackDashArray(style) {
      if (style === 'dashed') return '8 6';
      if (style === 'dotted') return '2 6';
      return null;
    }

    function setStatus(state, text) {
      const dot = document.getElementById("status-dot");
      dot.className = state || "";
      document.getElementById("status-text").textContent = text;
    }

    function toggleManager() {
      const panel = document.getElementById("manager-panel");
      const btn = document.getElementById("manage-btn");
      const open = panel.classList.toggle("open");
      btn.classList.toggle("active", open);
    }

    function formatTs(ts) {
      if (!ts) return "";
      return new Date(ts).toLocaleString(undefined, {
        month: "short", day: "numeric",
        hour: "2-digit", minute: "2-digit",
        timeZoneName: "short",
      });
    }

    function formatLastSeen(timestamp) {
      if (!timestamp) return "No data yet";
      const diffMin = Math.floor((Date.now() - new Date(timestamp).getTime()) / 60000);
      if (diffMin < 1) return "Last seen: just now";
      if (diffMin < 60) return `Last seen: ${diffMin} min ago`;
      const diffHrs = Math.floor(diffMin / 60);
      if (diffHrs < 24) return `Last seen: ${diffHrs} hr${diffHrs !== 1 ? "s" : ""} ago`;
      const diffDays = Math.floor(diffHrs / 24);
      return `Last seen: ${diffDays} day${diffDays !== 1 ? "s" : ""} ago`;
    }

    function applySoloMode() {
      for (const [mmsi, layers] of Object.entries(boatLayers)) {
        const visible = soloMmsi === null || mmsi === soloMmsi;
        if (visible) {
          if (!map.hasLayer(layers.polyline)) layers.polyline.addTo(map);
          if (!map.hasLayer(layers.marker)) layers.marker.addTo(map);
        } else {
          layers.polyline.remove();
          layers.marker.remove();
        }
      }
    }

    function nearestPoint(positions, lat, lng) {
      let nearest = null;
      let minDist = Infinity;
      for (const p of positions) {
        const d = (p.lat - lat) ** 2 + (p.lon - lng) ** 2;
        if (d < minDist) { minDist = d; nearest = p; }
      }
      return nearest;
    }

    function makeBoatIcon(color) {
      return L.divIcon({
        className: "",
        html: `<svg width="18" height="18" viewBox="0 0 18 18">
          <circle cx="9" cy="9" r="7" fill="${color}" stroke="#fff" stroke-width="2"/>
          <circle cx="9" cy="9" r="3" fill="#fff" opacity="0.7"/>
        </svg>`,
        iconSize: [18, 18],
        iconAnchor: [9, 9],
      });
    }

    function makePinIcon() {
      return L.divIcon({
        className: "",
        html: `<svg width="22" height="28" viewBox="0 0 22 28">
          <path d="M11 0C6.03 0 2 4.03 2 9c0 6.75 9 19 9 19s9-12.25 9-19c0-4.97-4.03-9-9-9z"
                fill="#f5a623" stroke="#fff" stroke-width="1.5"/>
          <circle cx="11" cy="9" r="3.5" fill="#fff"/>
        </svg>`,
        iconSize: [22, 28],
        iconAnchor: [11, 28],
        popupAnchor: [0, -30],
      });
    }

    function removeBoatFromMap(mmsi) {
      const layers = boatLayers[mmsi];
      if (!layers) return;
      layers.polyline.remove();
      layers.marker.remove();
      delete boatLayers[mmsi];
    }

    // ── Auto-refresh ─────────────────────────────────────────────────────────

    function startAutoRefresh() {
      stopAutoRefresh();
      refreshInterval = setInterval(refresh, 30000);
    }

    function stopAutoRefresh() {
      if (refreshInterval !== null) {
        clearInterval(refreshInterval);
        refreshInterval = null;
      }
    }

    // ── Date bar UI ──────────────────────────────────────────────────────────

    function updateDateBarUI() {
      const noMsg = document.getElementById("no-vessel-msg");
      const dateInputs = document.getElementById("date-inputs");
      const liveModeBtn = document.getElementById("live-mode-btn");
      if (soloMmsi) {
        noMsg.style.display = "none";
        dateInputs.style.display = "flex";
        liveModeBtn.style.display = filterActive ? "inline-block" : "none";
      } else {
        noMsg.style.display = "";
        dateInputs.style.display = "none";
        liveModeBtn.style.display = "none";
      }
    }

    async function applyFilter() {
      if (!soloMmsi) return;
      filterStart = document.getElementById("date-start").value || null;
      filterEnd = document.getElementById("date-end").value || null;
      filterActive = !!(filterStart || filterEnd);
      if (filterActive) {
        stopAutoRefresh();
        // Hide all other boats, show only selected with filtered positions
        for (const mmsi of Object.keys(boatLayers)) {
          if (mmsi !== soloMmsi) removeBoatFromMap(mmsi);
        }
        const boat = boats.find(b => b.mmsi === soloMmsi);
        if (boat) {
          await updateBoatOnMap(boat);
          applySoloMode();
        }
      } else {
        enterLiveMode();
        return;
      }
      updateDateBarUI();
    }

    function enterLiveMode() {
      filterActive = false;
      filterStart = null;
      filterEnd = null;
      const startEl = document.getElementById("date-start");
      const endEl = document.getElementById("date-end");
      if (startEl) startEl.value = "";
      if (endEl) endEl.value = "";
      updateDateBarUI();
      startAutoRefresh();
      refresh();
    }

    // ── Boat track rendering ─────────────────────────────────────────────────

    async function updateBoatOnMap(boat) {
      const useFilter = filterActive && boat.mmsi === soloMmsi;
      const params = new URLSearchParams();
      if (useFilter && filterStart) params.set("start", filterStart);
      if (useFilter && filterEnd) params.set("end", filterEnd);
      if (useFilter && (filterStart || filterEnd)) params.set("limit", "5000");
      const qs = params.toString();
      const url = `/api/positions/${boat.mmsi}` + (qs ? "?" + qs : "");

      let positions;
      try {
        const res = await fetch(url);
        positions = await res.json();
      } catch { return null; }

      if (positions.length === 0) return null;

      // API returns newest-first; reverse for chronological draw order
      const ordered = [...positions].reverse();
      const latLngs = ordered.map(p => [p.lat, p.lon]);

      removeBoatFromMap(boat.mmsi);

      const dashArray = trackDashArray(boat.track_style);
      const polyline = L.polyline(latLngs, {
        color: boat.color,
        weight: 3,
        opacity: 0.85,
        dashArray,
      }).addTo(map);

      polyline.on("mousemove", e => {
        const { lat, lng } = e.latlng;
        const near = nearestPoint(ordered, lat, lng);
        const tsLine = near?.timestamp
          ? `<br><span style="color:#7ab">${formatTs(near.timestamp)}</span>`
          : "";
        const spdLine = near?.speed != null
          ? `<br><span style="color:#888">${near.speed.toFixed(1)} kn</span>`
          : "";
        coordTip
          .setLatLng(e.latlng)
          .setContent(`${lat.toFixed(5)}, ${lng.toFixed(5)}${tsLine}${spdLine}`)
          .addTo(map);
      });
      polyline.on("mouseout", () => coordTip.remove());

      const latest = ordered[ordered.length - 1];
      const tsStr = latest.timestamp
        ? `<br><span style="font-size:11px;color:#888">${formatTs(latest.timestamp)}</span>`
        : "";
      const marker = L.marker([latest.lat, latest.lon], { icon: makeBoatIcon(boat.color) })
        .addTo(map)
        .bindPopup(
          `<b>${boat.name}</b><br>MMSI: ${boat.mmsi}` +
          `<br>Speed: ${latest.speed?.toFixed(1) ?? "—"} kn${tsStr}`
        );

      marker.bindTooltip(boat.name, {
        permanent: true,
        direction: "top",
        offset: [0, -12],
        className: "boat-name-label",
      });

      boatLayers[boat.mmsi] = { polyline, marker, positions: ordered };
      return latest;
    }

    // ── Saved points ─────────────────────────────────────────────────────────

    async function loadSavedPoints() {
      for (const m of savedPointLayers) m.remove();
      savedPointLayers.length = 0;

      try {
        const res = await fetch("/api/points");
        const points = await res.json();
        for (const pt of points) {
          const div = document.createElement("div");
          div.className = "point-popup";
          div.innerHTML = `
            <span class="pt-name">${pt.name || "Saved Point"}</span>
            <div class="pt-coords">${pt.lat.toFixed(6)}, ${pt.lon.toFixed(6)}</div>
            ${pt.notes ? `<div class="pt-notes">${pt.notes}</div>` : ""}
            <div class="pt-date">${new Date(pt.created_at).toLocaleString()}</div>
          `;
          const marker = L.marker([pt.lat, pt.lon], {
            icon: makePinIcon(),
            zIndexOffset: -10,
          }).addTo(map).bindPopup(div);
          savedPointLayers.push(marker);
        }
      } catch {}
    }

    // ── Click-to-save note popup ─────────────────────────────────────────────

    map.on("click", function(e) {
      const { lat, lng } = e.latlng;

      const div = document.createElement("div");
      div.className = "save-form";
      div.innerHTML = `
        <div class="sf-coords">${lat.toFixed(6)}, ${lng.toFixed(6)}</div>
        <div class="sf-field">
          <label class="sf-label">Note name</label>
          <input type="text" class="sf-name" placeholder="My waypoint" />
        </div>
        <div class="sf-field">
          <label class="sf-label">Notes</label>
          <textarea class="sf-notes" rows="3" placeholder="Observations..."></textarea>
        </div>
        <button class="sf-btn">Save</button>
        <div class="sf-err"></div>
      `;

      const nameInput = div.querySelector(".sf-name");
      const notesInput = div.querySelector(".sf-notes");
      const saveBtn = div.querySelector(".sf-btn");
      const errDiv = div.querySelector(".sf-err");

      saveBtn.addEventListener("click", async () => {
        const name = nameInput.value.trim();
        const notes = notesInput.value.trim();
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving...";
        try {
          const res = await fetch("/api/points", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ lat, lon: lng, name, notes }),
          });
          if (res.ok) {
            map.closePopup();
            await loadSavedPoints();
          } else {
            errDiv.textContent = "Save failed";
            saveBtn.disabled = false;
            saveBtn.textContent = "Save";
          }
        } catch {
          errDiv.textContent = "Network error";
          saveBtn.disabled = false;
          saveBtn.textContent = "Save";
        }
      });

      L.popup({ maxWidth: 260 })
        .setLatLng(e.latlng)
        .setContent(div)
        .openOn(map);
    });

    // ── Sidebar rendering ────────────────────────────────────────────────────

    function renderVesselSidebar(activeBoats, latestMap) {
      const list = document.getElementById("boat-list");
      list.innerHTML = "";

      if (activeBoats.length === 0) {
        list.innerHTML = '<div id="no-boats">No vessels tracked</div>';
        return;
      }

      for (const boat of activeBoats) {
        const latest = latestMap[boat.mmsi];
        const card = document.createElement("div");
        card.className = "boat-card" + (soloMmsi === boat.mmsi ? " solo-active" : "");
        const speedText = latest?.speed != null ? `${latest.speed.toFixed(1)} kn` : "—";
        const lastSeenText = formatLastSeen(latest?.timestamp);
        const distText = latest
          ? haversineNm(latest.lat, latest.lon, POINT_LOMA[0], POINT_LOMA[1]).toFixed(1) + " nm"
          : "—";
        const trackStyle = boat.track_style || 'solid';

        card.innerHTML = `
          <div class="boat-dot" style="background:${boat.color}" title="Change color"></div>
          <input type="color" value="${boat.color}" style="display:none">
          <div class="boat-info">
            <div class="boat-name">${boat.name}</div>
            <div class="boat-mmsi">${boat.mmsi}</div>
            <select class="style-select" title="Track style">
              <option value="solid"${trackStyle === 'solid' ? ' selected' : ''}>Solid</option>
              <option value="dashed"${trackStyle === 'dashed' ? ' selected' : ''}>Dashed</option>
              <option value="dotted"${trackStyle === 'dotted' ? ' selected' : ''}>Dotted</option>
            </select>
            <div class="boat-last-seen">${lastSeenText}</div>
          </div>
          <div class="boat-speed-dist">
            <div class="boat-speed">${speedText}</div>
            <div class="boat-dist">${distText}</div>
          </div>
        `;

        const dot = card.querySelector(".boat-dot");
        const colorInput = card.querySelector("input[type=color]");
        const styleSelect = card.querySelector(".style-select");

        dot.addEventListener("click", e => {
          e.stopPropagation();
          colorInput.click();
        });

        colorInput.addEventListener("change", async () => {
          const originalColor = dot.style.background;
          const newColor = colorInput.value;
          dot.style.background = newColor;
          try {
            const res = await fetch(`/api/boats/${boat.mmsi}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ color: newColor }),
            });
            if (!res.ok) throw new Error();
            const layers = boatLayers[boat.mmsi];
            if (layers) {
              layers.polyline.setStyle({ color: newColor });
              layers.marker.setIcon(makeBoatIcon(newColor));
            }
          } catch {
            dot.style.background = originalColor;
            colorInput.value = originalColor;
          }
        });

        styleSelect.addEventListener("change", async e => {
          e.stopPropagation();
          const newStyle = styleSelect.value;
          try {
            const res = await fetch(`/api/boats/${boat.mmsi}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ track_style: newStyle }),
            });
            if (!res.ok) throw new Error();
            const layers = boatLayers[boat.mmsi];
            if (layers) layers.polyline.setStyle({ dashArray: trackDashArray(newStyle) });
          } catch {
            styleSelect.value = boat.track_style || 'solid';
          }
        });

        card.addEventListener("click", () => {
          if (soloMmsi === boat.mmsi) {
            soloMmsi = null;
            if (filterActive) {
              enterLiveMode();
              return;
            }
          } else {
            soloMmsi = boat.mmsi;
            const layer = boatLayers[boat.mmsi];
            if (layer?.marker) map.setView(layer.marker.getLatLng(), 13);
          }
          applySoloMode();
          renderVesselSidebar(activeBoats, latestMap);
          updateDateBarUI();
        });

        list.appendChild(card);
      }
    }

    // ── Manager panel rendering ──────────────────────────────────────────────

    function renderManagerList(boats) {
      const list = document.getElementById("manager-boat-list");
      list.innerHTML = "";

      if (boats.length === 0) {
        list.innerHTML = '<div style="font-size:13px;color:#555;padding:6px 0">No vessels added yet</div>';
        return;
      }

      for (const boat of boats) {
        const item = document.createElement("div");
        item.className = "manager-boat-item";
        item.innerHTML = `
          <div class="color-swatch" style="background:${boat.color}"></div>
          <div class="manager-boat-name">
            <div class="name">${boat.name}</div>
            <div class="mmsi">${boat.mmsi}</div>
          </div>
          <label class="toggle-switch" title="${boat.active ? "Active" : "Inactive"}">
            <input type="checkbox" ${boat.active ? "checked" : ""} />
            <span class="toggle-slider"></span>
          </label>
          <button class="btn-sm backfill-btn" title="Fetch last 24h of positions">Backfill</button>
          <button class="btn-sm danger delete-btn" title="Delete vessel">Del</button>
        `;

        const checkbox = item.querySelector("input[type=checkbox]");
        checkbox.addEventListener("change", async () => {
          checkbox.disabled = true;
          try {
            const res = await fetch(`/api/boats/${boat.mmsi}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ active: checkbox.checked }),
            });
            if (res.ok) await refresh();
            else checkbox.checked = !checkbox.checked;
          } finally { checkbox.disabled = false; }
        });

        const backfillBtn = item.querySelector(".backfill-btn");
        backfillBtn.addEventListener("click", async () => {
          backfillBtn.textContent = "...";
          backfillBtn.disabled = true;
          try {
            const res = await fetch(`/api/boats/${boat.mmsi}/backfill`, { method: "POST" });
            const data = await res.json();
            backfillBtn.textContent = `+${data.inserted ?? 0}`;
            setTimeout(() => { backfillBtn.textContent = "Backfill"; }, 3000);
            if ((data.inserted ?? 0) > 0) await refresh();
          } catch {
            backfillBtn.textContent = "Err";
            setTimeout(() => { backfillBtn.textContent = "Backfill"; }, 2000);
          } finally { backfillBtn.disabled = false; }
        });

        const deleteBtn = item.querySelector(".delete-btn");
        deleteBtn.addEventListener("click", async () => {
          if (!confirm(`Delete "${boat.name}"? This will also remove all recorded positions.`)) return;
          deleteBtn.disabled = true;
          try {
            const res = await fetch(`/api/boats/${boat.mmsi}`, { method: "DELETE" });
            if (res.ok) { removeBoatFromMap(boat.mmsi); await refresh(); }
          } finally { deleteBtn.disabled = false; }
        });

        list.appendChild(item);
      }
    }

    // ── Main refresh ─────────────────────────────────────────────────────────

    async function refresh() {
      if (filterActive) return;

      try {
        const res = await fetch("/api/boats");
        boats = await res.json();
      } catch {
        setStatus("error", "Connection error");
        return;
      }

      const currentMmsis = new Set(boats.map(b => b.mmsi));
      for (const mmsi of Object.keys(boatLayers)) {
        if (!currentMmsis.has(mmsi)) removeBoatFromMap(mmsi);
      }

      cachedLatestMap = {};
      let anyPosition = false;

      const activeSet = new Set(boats.filter(b => b.active).map(b => b.mmsi));
      if (soloMmsi && !activeSet.has(soloMmsi)) soloMmsi = null;

      for (const boat of boats) {
        if (!boat.active) {
          removeBoatFromMap(boat.mmsi);
        } else {
          const latest = await updateBoatOnMap(boat);
          cachedLatestMap[boat.mmsi] = latest;
          if (latest) anyPosition = true;
        }
      }

      const activeBoats = boats.filter(b => b.active);
      renderVesselSidebar(activeBoats, cachedLatestMap);
      renderManagerList(boats);
      applySoloMode();
      updateDateBarUI();

      if (anyPosition) {
        setStatus("live", "Live");
      } else if (boats.some(b => b.active)) {
        setStatus(null, "Waiting for data...");
      } else {
        setStatus(null, "No active vessels");
      }
    }

    // ── Add boat form ────────────────────────────────────────────────────────

    document.getElementById("new-boat-color").addEventListener("input", e => {
      document.getElementById("new-boat-color-label").textContent = e.target.value;
    });

    document.getElementById("add-boat-form").addEventListener("submit", async e => {
      e.preventDefault();
      const name = document.getElementById("new-boat-name").value.trim();
      const mmsi = document.getElementById("new-boat-mmsi").value.trim();
      const color = document.getElementById("new-boat-color").value;
      const errEl = document.getElementById("add-error");
      const btn = document.getElementById("add-boat-btn");

      errEl.textContent = "";
      btn.disabled = true;
      btn.textContent = "Adding...";

      try {
        const res = await fetch("/api/boats", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, mmsi, color }),
        });
        if (res.ok) {
          document.getElementById("new-boat-name").value = "";
          document.getElementById("new-boat-mmsi").value = "";
          document.getElementById("new-boat-color").value = "#3388ff";
          document.getElementById("new-boat-color-label").textContent = "#3388ff";
          await refresh();
        } else {
          const data = await res.json();
          errEl.textContent = data.detail || "Failed to add vessel";
        }
      } catch {
        errEl.textContent = "Network error";
      } finally {
        btn.disabled = false;
        btn.textContent = "Add Vessel";
      }
    });

    // Initial load
    refresh();
    loadSavedPoints();
    startAutoRefresh();
  </script>
</body>
</html>
